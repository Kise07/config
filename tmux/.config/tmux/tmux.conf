set -g default-shell /bin/zsh
   # Remove default-command line, or use:
   # set -g default-command /bin/zsh -l
# Pi - Integration
set -g extended-keys-format csi-u

#set -g default-terminal "tmux-256color"
set -g default-terminal "tmux-256color"
#set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",tmux-256color:RGB"
# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
set -g allow-passthrough on

#### Key bindings

set-window-option -g mode-keys vi

#bind t send-key C-t
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "open '#{pane_current_path}'"
bind -r e kill-pane -a

# NOTE: the LazyGit popup binding (prefix + g) lives in utility.conf, which
# is sourced near the end of this file. Any bind declared here would be
# silently overwritten by it — keep it there, not here.

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

# Moving window
# bind-key -n C-S-Left swap-window -t -1 \; previous-window
# bind-key -n C-S-Right swap-window -t +1 \; next-window
bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

#### basic settings

set-option -g status-justify "left"
#set-option utf8-default on
#set-option -g mouse-select-pane
#mouse enable
set -g mouse on
set-window-option -g mode-keys vi
#set-window-option -g utf8 on
# look'n feel
set-option -g status-fg cyan
set-option -g status-bg black
set -g pane-active-border-style fg=colour166,bg=default
# Pane backgrounds are set once, near the bottom (pinned to Mocha #1e1e2e).
# The old `bg=default` lines that used to live here caused grey popups, since
# tmux can't detect Ghostty's real background.
set-option -g history-limit 64096

set -sg escape-time 10

#### COLOUR

# default statusbar colors
set-option -g status-style bg=colour235,fg=colour136,default

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=colour234,dim

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default,bright

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour136,bg=colour235

# message text
set-option -g message-style bg=colour235,fg=colour166

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

# source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

# ---- Oscura Midnight tmux theme ----
set -g @plugin 'omerxx/catppuccin-tmux'
# Match the rest of the stack: SessionX, FloaX and LazyGit are all on
# Catppuccin Mocha, so the status line should be too (was "oscura-midnight").
set -g @catppuccin_flavour "mocha"
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'

# SessionX (fzf picker) — hardcoded Catppuccin Mocha.
# These stay fixed on Mocha on purpose: they render INSIDE the terminal, which
# is always Mocha. Only the bar and window borders follow colors.sh.
set -g @sessionx-additional-options "--color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8 --color=fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc --color=marker:#b4befe,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8 --color=selected-bg:#45475a,border:#313244,label:#cdd6f4"
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-yank'

# Oscura separators for block-styled segments
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator "█"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Status bar height and update interval
set -g status on
set -g status-interval 5

# Module arrangement and content
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

setw -g window-status-separator ""

set -g status-position top
set -g pane-active-border-style "fg=magenta,bg=default"
set -g pane-border-style "fg=brightblack,bg=default"

# ── Pane backgrounds + FloaX popup — hardcoded Mocha ────────────────────────
# bg #1e1e2e is Ghostty's Mocha base, pinned explicitly so panes and popups
# never fall back to grey (tmux can't detect the terminal bg here — client_bg
# is empty). This also keeps everything INSIDE the terminal flush with the
# Ghostty window: same background, so no grey popups and no visible gap.
# Fixed on Mocha by design — colors.sh only drives bar + border.
set -g window-style        "fg=#bac2de,bg=#1e1e2e"
set -g window-active-style "fg=#cdd6f4,bg=#1e1e2e"
set -g @floax-text-color    "fg=#cdd6f4,bg=#1e1e2e"
set -g @floax-border-color  "#cba6f7"

# run '~/.tmux/plugins/tpm/tpm'
run '~/.config/tmux/plugins/tpm/tpm'

# Pi 
set -g extended-keys on
