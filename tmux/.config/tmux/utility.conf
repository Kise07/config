
# Display lazygit in a tmux popup (prefix + g).
#
# -s sets the popup's own background explicitly. LazyGit's background is
# transparent BY DESIGN — its theme config has no background-colour key, so it
# simply shows whatever sits behind it (LazyGit issue #1327). Here that backdrop
# is the tmux popup. Without -s, tmux fills the popup with its *default*
# colour, which it cannot resolve: `client_bg` stays empty because Ghostty never
# answers the OSC 11 query. tmux therefore paints its grey fallback, and
# LazyGit — inheriting it — looks washed out, even though a direct launch in a
# real Ghostty window is correctly dark.
# #1e1e2e is Catppuccin Mocha "base", the exact value Ghostty paints, so the
# popup backdrop now matches a direct launch and LazyGit inherits the right bg.
#
# display-popup draws a BORDER *around* the popup too, controlled by -S (not
# -s). tmux paints that frame with its default colour, which it also can't
# resolve (empty client_bg) — so it fell back to grey and showed up as the thick
# grey box framing the popup. -S 'fg=#1e1e2e,bg=#1e1e2e' colours that border the
# same Mocha base so the frame blends into the backdrop instead of outlining it.
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E -s 'bg=#1e1e2e' -S 'fg=#1e1e2e,bg=#1e1e2e' lazygit
