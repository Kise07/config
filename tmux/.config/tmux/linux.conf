# Linux-specific tmux configuration additions
# Add this to your tmux.conf or source it separately

# --- Linux-specific terminal settings ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:RGB"

# --- Linux clipboard integration (xclip) ---
# For copying to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Alternative if using xsel:
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -ib"

# --- Mouse support (Linux compatible) ---
set -g mouse on

# --- Linux-specific binding for opening URLs ---
# Use xdg-open on Linux (instead of macOS 'open')
bind o run-shell "xdg-open '#{pane_current_path}'"

# --- Pane border colors (Linux terminal compatible) ---
set -g pane-active-border-style fg=magenta,bg=default
set -g pane-border-style fg=brightblack,bg=default

